<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI試作プレビュー</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; }
    #chat-box { background: white; border: 1px solid #ccc; padding: 15px; height: 400px; overflow-y: auto; margin-bottom: 10px; border-radius: 5px; white-space: pre-wrap; line-height: 1.5; }
    .input-area { display: flex; gap: 10px; }
    input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
  <!-- GoogleのAIをブラウザで動かすための準備 -->
  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>
</head>
<body>
  <h2>AI 試作プレビュー</h2>
  <div id="chat-box"></div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="メッセージを入力してください...">
    <button id="send-btn">送信</button>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // ★★★ ここにAI Studioで取得したAPIキーを貼り付けます ★★★
    const API_KEY = "AQ.Ab8RN6JqasEFolrZZSEWLdmap8u7arkOnrICiMt0CfrvLJfojQ";
    
    // AIの準備（モデルは高速な gemini-1.5-flash を指定しています）
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

    document.getElementById('send-btn').addEventListener('click', async () => {
      const inputField = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputField.value;
      if (!prompt) return;

      // 画面に自分の入力を表示
      chatBox.innerHTML += `<div><b>あなた:</b><br>${prompt}</div><br>`;
      inputField.value = '';
      chatBox.innerHTML += `<div id="loading" style="color: #666;"><b>AI:</b> 考え中...</div><br>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // AIにリクエストを送信（APIを利用）
        const result = await model.generateContent(prompt);
        const response = result.response.text();

        // 結果を表示
        document.getElementById('loading').remove();
        chatBox.innerHTML += `<div><b>AI:</b><br>${response}</div><hr>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        document.getElementById('loading').remove();
        chatBox.innerHTML += `<div style="color:red;"><b>エラーが発生しました:</b> ${error.message}</div><hr>`;
      }
    });
  </script>
</body>
</html>
